[pytest]
; ---------------------------------------------------------------------------
; Chem ML Platform -- single test collection policy (spec task P0-03 #1).
;
; Every test file belongs to exactly ONE of the five declared suites.  The
; mapping lives in tests/conftest.py (SUITE_BY_STEM) and is applied
; automatically, so the release report can quote a per-suite number that can be
; regenerated with the commands below:
;
;   python -m pytest -m unit          # single-module behaviour
;   python -m pytest -m integration   # multi-module behaviour via the engine/API
;   python -m pytest -m security      # auth, authorisation, upload/path safety
;   python -m pytest -m benchmark     # known-answer scientific regression
;   python -m pytest -m desktop       # Electron shell / runtime probe / wiring
;   python -m pytest -m requires_env  # host-dependent (GPU, external solvers)
;
; tests/conftest.py appends the suite marker automatically, so --strict-markers
; is NOT used (the marker is injected rather than declared at the call site).
; An unclassified file is reported in the terminal summary.
; ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
markers =
    unit: single-module behaviour (pure functions, one class, no engine)
    integration: multi-module behaviour exercised through the real engine or HTTP API
    security: authentication, authorisation, upload limits, path/zipslip safety
    benchmark: known-answer scientific regression against fixed thresholds
    desktop: Electron shell, backend runtime probe and installer wiring
    requires_env: result depends on the host (GPU, external solver, network)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
