# Nginx reverse proxy for Chem ML Platform (docker "proxy" profile).
#
# Terminates HTTP in front of the API container, forwards /api and the WebSocket
# upgrade used by the live run feed, and serves the pre-built React editor from
# the same origin so the browser never hits a CORS preflight.

upstream chemml_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Live run feed (WebSocket) -- keep the connection alive.
    location /ws {
        proxy_pass http://chemml_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API + health probe.
    location /api/ {
        proxy_pass http://chemml_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256m;
    }

    # Lightweight liveness endpoint for the Nginx healthcheck.
    location = /healthz {
        proxy_pass http://chemml_api/api/health;
        proxy_set_header Host $host;
    }

    # Everything else is the single-page editor (pre-built frontend/dist).
    location / {
        proxy_pass http://chemml_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
