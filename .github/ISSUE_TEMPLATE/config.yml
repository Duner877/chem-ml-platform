# 选择报告类型

请选择最符合你情况的模板：

- **Bug report / 缺陷报告** —— 功能行为与预期不符，可复现。
- **Security vulnerability / 安全漏洞** —— 认证、授权、上传、隔离等安全边界问题。
- **Feature request / 功能建议** —— 新功能或改进建议。

无法归类时，请直接新建空白 Issue 并至少提供：**平台版本、操作系统、复现步骤、日志**。

---

## 提 Issue 前请先确认

- [ ] 已在 `CHANGELOG.md` 与 `docs/V07_KNOWN_LIMITATIONS.md` 中查找过该问题。
- [ ] 已确认问题能在**当前版本**（0.7.2）复现，而不是旧版本。
- [ ] 已移除日志中的令牌、密钥与个人路径。
- [ ] 若与科研结果有关，已附上 `provenance.json` 或运行记录。

## 哪些问题会被当作 P0

按任务书定义，P0 仅限**安全、交付或真实性**方面的发布阻断项，例如：

- 认证或授权可以被绕过；
- 安装包在干净目标机上无法安装或启动；
- 发布报告中的数字无法从同一提交重新生成；
- 内部近似计算被呈现为第三方软件的真实计算；
- 合成基准结果被当作真实数据验证结论。

普通功能缺陷通常按 P1 / P2 处理。
